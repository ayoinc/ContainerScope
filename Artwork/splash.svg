<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 320 352" width="320" height="352">
  <!-- UEFI boot logo (replaces TianoCore). Opaque black: the firmware blits it 1:1 onto a black
       framebuffer, and Windows re-shows it through the ACPI BGRT table above its loading dots. -->
  <rect width="320" height="352" fill="#000"/>
  <image x="16" y="0" width="288" height="288" xlink:href="mark.svg"/>
  <text x="160" y="330" text-anchor="middle" font-family="Helvetica Neue" font-size="28" font-weight="500" letter-spacing="0.5" fill="#e9efff">Container<tspan fill="#64d2ff">Scope</tspan></text>
</svg>
