<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- ContainerScope mark: an isometric shipping container inside a scope reticle.
       Single source for the app icon, UEFI boot splash and README art (see render.sh). -->
  <defs>
    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b4ecff"/>
      <stop offset="1" stop-color="#5ac8fa"/>
    </linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b95ff"/>
      <stop offset="1" stop-color="#0060df"/>
    </linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6e6cf0"/>
      <stop offset="1" stop-color="#3b39b5"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#64d2ff" stop-opacity="0"/>
      <stop offset="1" stop-color="#64d2ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- Reticle -->
  <circle cx="256" cy="256" r="184" fill="none" stroke="#e9efff" stroke-opacity="0.92" stroke-width="16"/>
  <g stroke="#e9efff" stroke-opacity="0.92" stroke-width="12" stroke-linecap="round">
    <line x1="256" y1="80" x2="256" y2="108"/>
    <line x1="256" y1="404" x2="256" y2="432"/>
    <line x1="80" y1="256" x2="108" y2="256"/>
    <line x1="404" y1="256" x2="432" y2="256"/>
  </g>
  <!-- Scan sweep on the upper-right quadrant -->
  <path d="M256 72 A184 184 0 0 1 440 256" fill="none" stroke="url(#scan)" stroke-width="16" stroke-linecap="round" filter="url(#glow)" opacity="0.7"/>
  <path d="M256 72 A184 184 0 0 1 440 256" fill="none" stroke="url(#scan)" stroke-width="16" stroke-linecap="round"/>

  <!-- Container: isometric box with corrugated sides -->
  <path d="M256 136 L359.92 196 L256 256 L152.08 196 Z" fill="url(#top)"/>
  <path d="M152.08 196 L256 256 L256 376 L152.08 316 Z" fill="url(#left)"/>
  <path d="M256 256 L359.92 196 L359.92 316 L256 376 Z" fill="url(#right)"/>
  <g stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-opacity="0.24">
    <line x1="169.40" y1="220" x2="169.40" y2="312"/>
    <line x1="186.72" y1="230" x2="186.72" y2="322"/>
    <line x1="204.04" y1="240" x2="204.04" y2="332"/>
    <line x1="221.36" y1="250" x2="221.36" y2="342"/>
    <line x1="238.68" y1="260" x2="238.68" y2="352"/>
  </g>
  <g stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-opacity="0.16">
    <line x1="273.32" y1="260" x2="273.32" y2="352"/>
    <line x1="290.64" y1="250" x2="290.64" y2="342"/>
    <line x1="307.96" y1="240" x2="307.96" y2="332"/>
    <line x1="325.28" y1="230" x2="325.28" y2="322"/>
    <line x1="342.60" y1="220" x2="342.60" y2="312"/>
  </g>
  <!-- Crisp top ridge -->
  <path d="M152.08 196 L256 256 L359.92 196" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="3" stroke-linejoin="round"/>
</svg>
