name: Release

# Cut with Scripts/release.sh X.Y.Z, which bumps VERSION and pushes tag vX.Y.Z.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  firmware:
    uses: ./.github/workflows/firmware.yml

  release:
    needs: firmware
    runs-on: macos-26
    env:
      # Repository variable: the Developer ID Application identity's SHA-1 (see docs/developer/releasing.md).
      SIGN_IDENTITY: ${{ vars.SIGN_IDENTITY }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Tag matches VERSION
        run: |
          test "${GITHUB_REF_NAME#v}" = "$(cat VERSION)" || {
            echo "::error::Tag $GITHUB_REF_NAME does not match VERSION $(cat VERSION)"; exit 1; }
      - uses: actions/download-artifact@v8
        with:
          name: firmware
          path: build/deps/firmware
      - name: Download cache (engine installer, Kata kernel archive)
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/ContainerScope-build
          key: deps-${{ hashFiles('Scripts/deps.env') }}
      - name: Stage bundled components
        run: brew install qemu swtpm zstd && Scripts/fetch-deps.sh
      - name: Import signing identity
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: |
          [ -n "$SIGN_IDENTITY" ] && [ -n "$P12_BASE64" ] && [ -n "$NOTARY_KEY_P8" ] || {
            echo "::error::Set the SIGN_IDENTITY variable and the signing secrets (docs/developer/releasing.md)"; exit 1; }
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/devid.p12"
          security import "$RUNNER_TEMP/devid.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/devid.p12"
          security find-identity -v -p codesigning "$KEYCHAIN" | grep -q "$SIGN_IDENTITY"
          printf '%s\n' "$NOTARY_KEY_P8" > "$RUNNER_TEMP/notary.p8"
          echo "NOTARY_KEY_PATH=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"
      - name: Build app
        run: Scripts/build-app.sh
      - name: Build, sign and notarize DMG
        id: dmg
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: |
          DMG="$(Scripts/build-dmg.sh)"
          (cd build && shasum -a 256 "$(basename "$DMG")" > "$(basename "$DMG").sha256")
          echo "path=$DMG" >> "$GITHUB_OUTPUT"
      - name: Collect third-party sources
        id: sources
        run: echo "path=$(Scripts/collect-sources.sh "build/ContainerScope-${GITHUB_REF_NAME#v}-third-party-sources.tar")" >> "$GITHUB_OUTPUT"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "${{ steps.dmg.outputs.path }}" "${{ steps.dmg.outputs.path }}.sha256" "${{ steps.sources.outputs.path }}" \
            --title "ContainerScope ${GITHUB_REF_NAME#v}" \
            --generate-notes
      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/notary.p8"
