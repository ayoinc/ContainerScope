name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware:
    uses: ./.github/workflows/firmware.yml

  build:
    needs: firmware
    # Apple `container` and the Liquid Glass UI need the macOS 26 SDK (Xcode 26), Apple Silicon.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # build number = commit count
      - name: Toolchain
        run: swift --version && xcrun --show-sdk-version
      - uses: actions/download-artifact@v8
        with:
          name: firmware
          path: build/deps/firmware
      - name: Download cache (engine installer, Kata kernel archive)
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/ContainerScope-build
          key: deps-${{ hashFiles('Scripts/deps.env') }}
      - name: Stage bundled components
        run: brew install qemu swtpm zstd && Scripts/fetch-deps.sh
      - name: Build app
        run: Scripts/build-app.sh
      - name: Build DMG
        run: Scripts/build-dmg.sh
      - uses: actions/upload-artifact@v7
        with:
          name: ContainerScope-dmg
          path: build/ContainerScope-*.dmg
          retention-days: 14
